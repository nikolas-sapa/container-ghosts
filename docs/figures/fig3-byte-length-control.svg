<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">Byte-length control</title><desc id="desc">Why byte-length matching is required and the zero-delta result achieved by the artifact</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006BFF"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A99AD"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#008B8A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6658C8"/></marker></defs><rect width="1600" height="960" rx="28" fill="#F7F9FC"/><text x="64" y="58" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800" fill="#006BFF" text-anchor="start" opacity="1" letter-spacing="2.2">CONTAINER GHOSTS / CONFOUND CONTROL</text><text x="64" y="105" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="43" font-weight="780" fill="#111C2E" text-anchor="start" opacity="1">Lossless bytes are not neutral unless length is controlled.</text><text x="64" y="139" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="430" fill="#526274" text-anchor="start" opacity="1">A pipeline can react to file size even when every decoded pixel is unchanged.</text><rect x="64" y="184" width="456" height="622" rx="24" fill="#FFFFFF" stroke="#DDE5EE" stroke-width="1.2" opacity="1"/><text x="92" y="218" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" fill="#006BFF" text-anchor="start" opacity="1" letter-spacing="1.8">FAILURE MODE</text><text x="92" y="249" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="750" fill="#111C2E" text-anchor="start" opacity="1">Representation changes size</text><text x="92" y="340" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="56" font-weight="820" fill="#C7355D" text-anchor="start" opacity="1">129x</text><text x="92" y="374" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650" fill="#111C2E" text-anchor="start" opacity="1">same pixels, lossless re-encode</text><text x="92" y="404" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#526274" text-anchor="start" opacity="1">forensics guardrail example</text><line x1="92" y1="438" x2="456" y2="438" stroke="#E9EEF5" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="92" y="468" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#526274" text-anchor="start" opacity="1" letter-spacing="1.1">same pixels, linear byte scale</text><rect x="92" y="482" width="3" height="26" rx="1.5" fill="#C7355D" stroke="none" stroke-width="1" opacity="1"/><text x="104" y="500" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="680" fill="#C7355D" text-anchor="start" opacity="1">477 B compact lossless encoding</text><rect x="92" y="522" width="368" height="26" rx="6" fill="#C7355D" stroke="none" stroke-width="1" opacity="0.82"/><text x="104" y="540" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="680" fill="#FFFFFF" text-anchor="start" opacity="1">~61 KB different lossless encoding</text><rect x="92" y="646" width="368" height="104" rx="18" fill="#FAE8EF" stroke="none" stroke-width="1" opacity="1"/><text x="116" y="683" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#C7355D" text-anchor="start" opacity="1">If length differs, size-dependent</text><text x="116" y="710" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#C7355D" text-anchor="start" opacity="1">preprocessing becomes a treatment.</text><rect x="544" y="184" width="456" height="622" rx="24" fill="#FFFFFF" stroke="#DDE5EE" stroke-width="1.2" opacity="1"/><text x="572" y="218" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" fill="#006BFF" text-anchor="start" opacity="1" letter-spacing="1.8">OBSERVED ARTIFACT BEHAVIOR</text><text x="572" y="249" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="750" fill="#111C2E" text-anchor="start" opacity="1">Re-encoding swings bytes</text><text x="572" y="340" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="50" font-weight="820" fill="#006BFF" text-anchor="start" opacity="1">7.85x</text><text x="572" y="374" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="650" fill="#111C2E" text-anchor="start" opacity="1">maximum deflate-0 / deflate-9 ratio (document_like)</text><text x="572" y="404" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#526274" text-anchor="start" opacity="1">range across six development images: 1.14x to 7.85x</text><text x="572" y="462" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="680" fill="#111C2E" text-anchor="start" opacity="1">PC0 / deflate level 0</text><rect x="572" y="472" width="244" height="44" rx="9" fill="#EEF2F6" stroke="none" stroke-width="1" opacity="1"/><rect x="572" y="472" width="244.0" height="44" rx="9" fill="#006BFF" stroke="none" stroke-width="1" opacity="1"/><text x="830" y="499.0" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750" fill="#006BFF" text-anchor="start" opacity="1">602,673 B</text><text x="572" y="578" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="680" fill="#111C2E" text-anchor="start" opacity="1">PC9 / deflate level 9</text><rect x="572" y="588" width="244" height="44" rx="9" fill="#EEF2F6" stroke="none" stroke-width="1" opacity="1"/><rect x="572" y="588" width="31.093073690044186" height="44" rx="9" fill="#008B8A" stroke="none" stroke-width="1" opacity="1"/><text x="830" y="615.0" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750" fill="#008B8A" text-anchor="start" opacity="1">76,799 B</text><text x="572" y="704" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.2" font-weight="600" fill="#526274" text-anchor="start" opacity="1">These PC/PF/PS exploration arms are explicitly</text><text x="572" y="725" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.2" font-weight="600" fill="#526274" text-anchor="start" opacity="1">marked byte_length_factor=true; they are not</text><text x="572" y="746" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.2" font-weight="600" fill="#526274" text-anchor="start" opacity="1">hidden as pure representation-only contrasts.</text><rect x="1024" y="184" width="512" height="622" rx="24" fill="#FFFFFF" stroke="#DDE5EE" stroke-width="1.2" opacity="1"/><text x="1052" y="218" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" fill="#006BFF" text-anchor="start" opacity="1" letter-spacing="1.8">PRIMARY CONTROL</text><text x="1052" y="249" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="750" fill="#111C2E" text-anchor="start" opacity="1">Exact padding removes the confound</text><text x="1052" y="340" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="56" font-weight="820" fill="#167A52" text-anchor="start" opacity="1">0 B</text><text x="1052" y="374" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650" fill="#111C2E" text-anchor="start" opacity="1">maximum byte-length delta in both exact groups</text><text x="1052" y="418" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="800" fill="#526274" text-anchor="start" opacity="1" letter-spacing="1.1">example image: color_fields</text><rect x="1052" y="442" width="78" height="58" rx="12" fill="#E4F5F4" stroke="#008B8A" stroke-width="1.2" opacity="1"/><text x="1091" y="467" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#008B8A" text-anchor="middle" opacity="1">P0</text><text x="1091" y="488" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" fill="#243449" text-anchor="middle" opacity="1">133,229</text><rect x="1143" y="442" width="78" height="58" rx="12" fill="#E4F5F4" stroke="#008B8A" stroke-width="1.2" opacity="1"/><text x="1182" y="467" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#008B8A" text-anchor="middle" opacity="1">P1</text><text x="1182" y="488" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" fill="#243449" text-anchor="middle" opacity="1">133,229</text><rect x="1234" y="442" width="78" height="58" rx="12" fill="#E4F5F4" stroke="#008B8A" stroke-width="1.2" opacity="1"/><text x="1273" y="467" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#008B8A" text-anchor="middle" opacity="1">PT</text><text x="1273" y="488" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" fill="#243449" text-anchor="middle" opacity="1">133,229</text><rect x="1325" y="442" width="78" height="58" rx="12" fill="#E4F5F4" stroke="#008B8A" stroke-width="1.2" opacity="1"/><text x="1364" y="467" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#008B8A" text-anchor="middle" opacity="1">PTC</text><text x="1364" y="488" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" fill="#243449" text-anchor="middle" opacity="1">133,229</text><rect x="1416" y="442" width="78" height="58" rx="12" fill="#E4F5F4" stroke="#008B8A" stroke-width="1.2" opacity="1"/><text x="1455" y="467" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#008B8A" text-anchor="middle" opacity="1">PTA</text><text x="1455" y="488" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" fill="#243449" text-anchor="middle" opacity="1">133,229</text><text x="1052" y="534" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#526274" text-anchor="start" opacity="1">PNG core group: five containers, one exact length</text><rect x="1052" y="572" width="136" height="64" rx="12" fill="#EEEAFB" stroke="#6658C8" stroke-width="1.2" opacity="1"/><text x="1120" y="599" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#6658C8" text-anchor="middle" opacity="1">JC</text><text x="1120" y="621" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#243449" text-anchor="middle" opacity="1">50,697 B</text><rect x="1206" y="572" width="136" height="64" rx="12" fill="#E6F4ED" stroke="#167A52" stroke-width="1.2" opacity="1"/><text x="1274" y="599" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#167A52" text-anchor="middle" opacity="1">JA</text><text x="1274" y="621" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#243449" text-anchor="middle" opacity="1">50,697 B</text><rect x="1362" y="572" width="128" height="64" rx="12" fill="#E6F4ED" stroke="#167A52" stroke-width="1.2" opacity="1"/><text x="1426" y="599" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5" font-weight="800" fill="#167A52" text-anchor="middle" opacity="1">delta 0 B</text><text x="1426" y="621" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10.5" font-weight="650" fill="#526274" text-anchor="middle" opacity="1">camera vs AI</text><rect x="1052" y="674" width="456" height="104" rx="18" fill="#E6F4ED" stroke="none" stroke-width="1" opacity="1"/><text x="1076" y="706" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="760" fill="#167A52" text-anchor="start" opacity="1">6/6 PNG and 6/6 JPEG groups at zero delta</text><text x="1076" y="734" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5" font-weight="620" fill="#243449" text-anchor="start" opacity="1">30 exact-group PNG files and 12 provenance JPEG files</text><text x="1076" y="760" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5" font-weight="620" fill="#243449" text-anchor="start" opacity="1">padding uses neutral PNG tEXt or JPEG COM filler</text><rect x="64" y="838" width="1472" height="66" rx="18" fill="#FFFFFF" stroke="#DDE5EE" stroke-width="1.2" opacity="1"/><text x="92" y="879" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="620" fill="#111C2E" text-anchor="start" opacity="1">Honest boundary: stripped-J0 insertion contrasts retain inserted byte length as an explicit experimental factor; exact matching is enforced where the claim requires it.</text><line x1="64" y1="908" x2="1536" y2="908" stroke="#DDE5EE" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="64" y="938" font-family="'Geist Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="500" fill="#526274" text-anchor="start" opacity="1">Sources: docs/EXTRACTIONS.md guardrail; artifacts/build_manifest.json and artifacts/verification_manifest.json for all artifact measurements.</text></svg>
